<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="L'atelier des Carnets d'entretien : la flotte en cartes, photos sépia, plaques noires, compteurs et alertes d'échéance">
  <!-- Illustration originale reprenant l'interface du site (atelier vintage : laiton, panneau perforé, plaques noires) -->
  <defs>
    <pattern id="perfore" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#15110d"/>
      <circle cx="11" cy="11" r="2.4" fill="#000" opacity=".55"/>
      <circle cx="11.6" cy="11.8" r="2.4" fill="#3a2e22" opacity=".25"/>
    </pattern>
    <radialGradient id="lampe" cx=".55" cy="-.05" r=".8">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity=".2"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bois" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2614"/><stop offset=".5" stop-color="#4a311b"/><stop offset="1" stop-color="#2d1d10"/>
    </linearGradient>
    <linearGradient id="laiton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1c27a"/><stop offset=".5" stop-color="#d4943a"/><stop offset="1" stop-color="#a86f26"/>
    </linearGradient>
    <linearGradient id="panneau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2119"/><stop offset="1" stop-color="#1b1510"/>
    </linearGradient>
    <linearGradient id="sepia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9c49a"/><stop offset=".6" stop-color="#b89a6a"/><stop offset="1" stop-color="#8a6f48"/>
    </linearGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".65"/>
    </filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .2  0 0 0 0 .15  0 0 0 0 .08  0 0 0 .35 0"/></filter>
    <!-- Emblème : roue dentée et clés croisées -->
    <g id="embleme">
      <g fill="url(#laiton)">
        <circle r="22"/>
        <g id="dents"><rect x="-4" y="-29" width="8" height="10" rx="1.5"/><rect x="-4" y="19" width="8" height="10" rx="1.5"/></g>
        <use href="#dents" transform="rotate(45)"/><use href="#dents" transform="rotate(90)"/><use href="#dents" transform="rotate(135)"/>
      </g>
      <circle r="12" fill="#15110d"/>
      <g stroke="#efe4cc" stroke-width="4" stroke-linecap="round"><path d="M-9 9 L9 -9 M-9 -9 L9 9"/></g>
      <circle r="3.5" fill="#d4943a"/>
    </g>
    <clipPath id="tirage"><rect width="244" height="132"/></clipPath>
  </defs>

  <rect width="1200" height="480" fill="url(#perfore)"/>
  <rect width="1200" height="480" fill="url(#lampe)"/>

  <!-- Barre latérale en bois -->
  <rect width="250" height="480" fill="url(#bois)"/>
  <rect width="250" height="480" filter="url(#grain)" opacity=".6"/>
  <rect x="248" width="3" height="480" fill="#d4943a" opacity=".55"/>
  <use href="#embleme" transform="translate(58 58)"/>
  <text x="96" y="56" font-family="'Alfa Slab One', Rockwell, 'Roboto Slab', Georgia, serif" font-size="22" font-weight="900" fill="#d4943a">Carnets</text>
  <text x="97" y="76" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="11" letter-spacing="3.2" fill="#efe4cc" opacity=".75">D'ENTRETIEN</text>
  <g font-family="Oswald, 'Arial Narrow', sans-serif" font-size="14" letter-spacing="1.6" fill="#efe4cc">
    <rect x="22" y="122" width="208" height="38" rx="5" fill="#000" opacity=".4"/>
    <rect x="22" y="130" width="4" height="22" rx="1" fill="#d4943a"/>
    <text x="70" y="147" fill="#d4943a">MA FLOTTE</text>
    <text x="70" y="191" opacity=".8">STATISTIQUES</text>
    <text x="70" y="235" opacity=".8">RECHERCHE</text>
    <text x="70" y="279" opacity=".8">SUIVI</text>
    <text x="70" y="323" opacity=".8">ALERTES</text>
  </g>
  <g fill="none" stroke="#d4943a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38 141 h18 l-2 -6 h-14 z M40 146 a2 2 0 1 0 0.1 0 M54 146 a2 2 0 1 0 0.1 0"/>
    <path d="M40 192 v-10 M47 192 v-15 M54 192 v-7" opacity=".8"/>
    <circle cx="45" cy="229" r="6" opacity=".8"/><path d="M50 234 l5 5" opacity=".8"/>
    <path d="M38 275 l4 4 l12 -12" opacity=".8"/>
    <path d="M46 308 l9 16 h-18 z" opacity=".8"/>
  </g>
  <rect x="196" y="306" width="24" height="22" rx="11" fill="#c2553a"/>
  <text x="208" y="322" text-anchor="middle" font-family="Oswald, Arial, sans-serif" font-size="13" font-weight="700" fill="#efe4cc">2</text>

  <!-- Titre et compteurs -->
  <text x="292" y="72" font-family="'Alfa Slab One', Rockwell, 'Roboto Slab', Georgia, serif" font-size="38" font-weight="900" fill="#d4943a" letter-spacing="1">MA FLOTTE</text>
  <rect x="292" y="84" width="140" height="3" fill="#d4943a"/>
  <g font-family="Oswald, 'Arial Narrow', sans-serif" font-size="11" letter-spacing="1.5" fill="#d4943a" opacity=".85">
    <text x="720" y="40">EN SERVICE</text><text x="840" y="40">INTERVENTIONS</text><text x="990" y="40">INVESTI (€)</text>
  </g>
  <!-- Rouleaux de compteur -->
  <g font-family="'Courier New', monospace" font-size="22" font-weight="700" fill="#f5f0e6" text-anchor="middle">
    <g transform="translate(720 50)">
      <rect width="46" height="34" rx="3" fill="#0a0907" stroke="#5a4a38"/>
      <text x="12" y="25">0</text><text x="34" y="25">6</text>
    </g>
    <g transform="translate(840 50)">
      <rect width="69" height="34" rx="3" fill="#0a0907" stroke="#5a4a38"/>
      <text x="12" y="25">1</text><text x="35" y="25">0</text><text x="57" y="25">4</text>
    </g>
    <g transform="translate(990 50)">
      <rect width="140" height="34" rx="3" fill="#0a0907" stroke="#5a4a38"/>
      <text x="13" y="25">4</text><text x="36" y="25">8</text><text x="59" y="25">2</text><text x="82" y="25">6</text><text x="105" y="25">0</text><text x="128" y="25">5</text>
    </g>
    <g stroke="#000" stroke-opacity=".6"><path d="M743 50 v34 M863 50 v34 M886 50 v34 M1013 50 v34 M1036 50 v34 M1059 50 v34 M1082 50 v34 M1105 50 v34"/></g>
  </g>

  <!-- Carte 1 : scooter -->
  <g transform="translate(292 116)" filter="url(#ombre)">
    <rect width="270" height="390" rx="8" fill="url(#panneau)" stroke="#d4943a" stroke-opacity=".3"/>
    <g fill="#8a7a66"><circle cx="10" cy="10" r="2.5"/><circle cx="260" cy="10" r="2.5"/></g>
    <g transform="translate(13 14) rotate(-0.8)">
      <rect x="-6" y="-6" width="256" height="144" fill="#efe4cc"/>
      <g clip-path="url(#tirage)">
        <rect width="244" height="132" fill="url(#sepia)"/>
        <rect y="96" width="244" height="36" fill="#7d6646"/>
        <g transform="translate(120 70)" fill="#5a4630">
          <path d="M-62 26 C-60 4 -38 -8 -14 -6 L16 -6 C30 -24 40 -30 48 -30 L52 -24 C42 -20 36 -10 34 4 C46 6 58 16 60 26 Z"/>
          <circle cx="-40" cy="30" r="15" fill="#2e2418"/><circle cx="42" cy="30" r="15" fill="#2e2418"/>
          <circle cx="-40" cy="30" r="6" fill="#b89a6a"/><circle cx="42" cy="30" r="6" fill="#b89a6a"/>
          <path d="M44 -30 l10 -16 M48 -46 h14" stroke="#2e2418" stroke-width="4" fill="none" stroke-linecap="round"/>
          <rect x="-36" y="-16" width="34" height="8" rx="3" fill="#2e2418"/>
        </g>
        <rect width="244" height="132" filter="url(#grain)"/>
      </g>
      <rect x="12" y="104" width="86" height="20" rx="2" fill="#0d0d0d" stroke="#bdbdbd"/>
      <text x="55" y="119" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#e8e8e8">LD-125-56</text>
    </g>
    <circle cx="244" cy="18" r="23" fill="#c2553a" stroke="#efe4cc" stroke-opacity=".6" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="244" y="24" text-anchor="middle" font-family="'Alfa Slab One', Rockwell, Georgia, serif" font-size="14" font-weight="900" fill="#efe4cc" transform="rotate(12 244 18)">1956</text>
    <text x="20" y="182" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="11" letter-spacing="2.4" fill="#d4943a">SCOOTER</text>
    <text x="20" y="208" font-family="'Alfa Slab One', Rockwell, Georgia, serif" font-size="21" font-weight="900" fill="#efe4cc">LAMBRETTA <tspan fill="#d4943a">LD125</tspan></text>
    <text x="20" y="236" font-family="Barlow, Arial, sans-serif" font-size="13" fill="#efe4cc" opacity=".7">12 480 km   ·   18 interventions</text>
    <rect x="20" y="252" width="230" height="1" fill="#d4943a" opacity=".2"/>
    <text x="20" y="276" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="13" letter-spacing="1.4" fill="#8fbf9f">OUVRIR LE CARNET  ›</text>
  </g>

  <!-- Carte 2 : moto de trial, alerte CT -->
  <g transform="translate(590 116)" filter="url(#ombre)">
    <rect width="270" height="390" rx="8" fill="url(#panneau)" stroke="#d4943a" stroke-opacity=".3"/>
    <g fill="#8a7a66"><circle cx="10" cy="10" r="2.5"/><circle cx="260" cy="10" r="2.5"/></g>
    <g transform="translate(13 14) rotate(0.6)">
      <rect x="-6" y="-6" width="256" height="144" fill="#efe4cc"/>
      <g clip-path="url(#tirage)">
        <rect width="244" height="132" fill="url(#sepia)"/>
        <path d="M0 100 L60 86 L110 98 L170 80 L244 92 V132 H0 z" fill="#7d6646"/>
        <g transform="translate(122 66)" stroke="#2e2418" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="-42" cy="22" r="20"/><circle cx="42" cy="22" r="20"/>
          <path d="M-42 22 L-12 -6 L18 -6 L42 22 M18 -6 L10 -30 L22 -32 M-12 -6 L-28 -14 L-46 -10"/>
          <path d="M-8 -6 L6 14 L-20 14 Z" fill="#5a4630" stroke-width="3"/>
        </g>
        <rect width="244" height="132" filter="url(#grain)"/>
      </g>
      <rect x="12" y="104" width="86" height="20" rx="2" fill="#0d0d0d" stroke="#bdbdbd"/>
      <text x="55" y="119" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#e8e8e8">BS-350-76</text>
    </g>
    <circle cx="244" cy="18" r="23" fill="#c2553a" stroke="#efe4cc" stroke-opacity=".6" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="244" y="24" text-anchor="middle" font-family="'Alfa Slab One', Rockwell, Georgia, serif" font-size="14" font-weight="900" fill="#efe4cc" transform="rotate(12 244 18)">1976</text>
    <text x="20" y="182" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="11" letter-spacing="2.4" fill="#d4943a">MOTO</text>
    <text x="20" y="208" font-family="'Alfa Slab One', Rockwell, Georgia, serif" font-size="21" font-weight="900" fill="#efe4cc">BULTACO <tspan fill="#d4943a">SHERPA T</tspan></text>
    <text x="20" y="236" font-family="Barlow, Arial, sans-serif" font-size="13" fill="#efe4cc" opacity=".7">8 950 km   ·   26 interventions</text>
    <g transform="translate(20 247)">
      <rect width="150" height="22" rx="3" fill="#c2553a" opacity=".18" stroke="#c2553a" stroke-opacity=".7"/>
      <path d="M12 16 l6 -11 l6 11 z" fill="none" stroke="#e07a5f" stroke-width="1.8" stroke-linejoin="round"/>
      <text x="32" y="16" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="12" letter-spacing="1" fill="#e07a5f">CT À REPASSER</text>
    </g>
    <rect x="20" y="282" width="230" height="1" fill="#d4943a" opacity=".2"/>
    <text x="20" y="306" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="13" letter-spacing="1.4" fill="#8fbf9f">OUVRIR LE CARNET  ›</text>
  </g>

  <!-- Carte 3 : roadster -->
  <g transform="translate(888 116)" filter="url(#ombre)">
    <rect width="270" height="390" rx="8" fill="url(#panneau)" stroke="#d4943a" stroke-opacity=".3"/>
    <g fill="#8a7a66"><circle cx="10" cy="10" r="2.5"/><circle cx="260" cy="10" r="2.5"/></g>
    <g transform="translate(13 14) rotate(-0.5)">
      <rect x="-6" y="-6" width="256" height="144" fill="#efe4cc"/>
      <g clip-path="url(#tirage)">
        <rect width="244" height="132" fill="url(#sepia)"/>
        <rect y="100" width="244" height="32" fill="#7d6646"/>
        <g transform="translate(122 76)" fill="#4a3826">
          <path d="M-92 20 C-90 4 -76 -2 -56 -6 C-36 -22 -10 -26 14 -22 C34 -18 52 -8 72 -4 C86 -2 94 6 94 20 Z"/>
          <path d="M-30 -10 C-18 -20 2 -22 16 -16 L20 -8 L-34 -8 Z" fill="#b89a6a" opacity=".55"/>
          <circle cx="-56" cy="22" r="16" fill="#241a10"/><circle cx="58" cy="22" r="16" fill="#241a10"/>
          <circle cx="-56" cy="22" r="7" fill="#b89a6a"/><circle cx="58" cy="22" r="7" fill="#b89a6a"/>
        </g>
        <rect width="244" height="132" filter="url(#grain)"/>
      </g>
      <rect x="12" y="104" width="86" height="20" rx="2" fill="#0d0d0d" stroke="#bdbdbd"/>
      <text x="55" y="119" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#e8e8e8">RS-987-07</text>
    </g>
    <circle cx="244" cy="18" r="23" fill="#c2553a" stroke="#efe4cc" stroke-opacity=".6" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="244" y="24" text-anchor="middle" font-family="'Alfa Slab One', Rockwell, Georgia, serif" font-size="14" font-weight="900" fill="#efe4cc" transform="rotate(12 244 18)">2007</text>
    <text x="20" y="182" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="11" letter-spacing="2.4" fill="#d4943a">VOITURE</text>
    <text x="20" y="208" font-family="'Alfa Slab One', Rockwell, Georgia, serif" font-size="21" font-weight="900" fill="#efe4cc">ROADSTER <tspan fill="#d4943a">2.7</tspan></text>
    <text x="20" y="236" font-family="Barlow, Arial, sans-serif" font-size="13" fill="#efe4cc" opacity=".7">175 000 km   ·   23 interventions</text>
    <rect x="20" y="252" width="230" height="1" fill="#d4943a" opacity=".2"/>
    <text x="20" y="276" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="13" letter-spacing="1.4" fill="#8fbf9f">OUVRIR LE CARNET  ›</text>
  </g>

  <!-- Tampon de l'atelier -->
  <g transform="translate(626 70) rotate(-8)" opacity=".75">
    <rect x="-70" y="-20" width="140" height="36" rx="4" fill="none" stroke="#c2553a" stroke-width="3"/>
    <text y="5" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#c2553a">CARNET À JOUR</text>
  </g>
</svg>
